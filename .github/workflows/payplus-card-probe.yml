name: PayPlus card-on-file probe

# Asks PayPlus which shapes of "save a card" page it will generate — specifically whether an
# approval-only page (charge_method 2 / J5) works, which would make the ₪1 verification charge on
# the billing page unnecessary.
#
# Safe to run at any time: generateLink creates a page, it does not charge anybody. Money moves
# only if a human opens the page and completes it, and the script prints no URLs.
#
# Through `railway run` for the same reason as the one-off payment link: the PayPlus merchant keys
# live in Railway, and a second copy in Actions secrets would be another place to rotate.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Probe
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
        run: |
          set -euo pipefail
          npm i -g @railway/cli >/dev/null 2>&1
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/payplus-card-probe.ts
