name: Provision the voice agent on Railway

# Creates the Railway service that removes the managed runtime's cold start — the ~5 seconds the
# first caller after a quiet stretch waits while Cartesia scales the agent up from zero.
#
# It stops deliberately short of switching the phone line over. Creating the service and pointing
# Cartesia at it are separate acts with very different blast radii: this one adds a service that
# nothing routes to yet, and is undone by deleting it. The switch is done by "Fix Cartesia agent
# config" with deployment_url, and only makes sense once /health here reports a service that can
# actually take a call.
#
# ‼️ The project token is scoped to the whole project, which also holds the backend. Deploying the
# voice agent over that service would take the API down for every salon, so the service name is
# checked against it and the job aborts rather than guessing.
on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Name for the new Railway service"
        type: string
        default: "tori-voice-agent"
      project:
        description: "Railway project to create it in (read off `railway status`)"
        type: string
        default: "Tori"
      deploy:
        description: "Upload and build voice-agent/ after creating the service"
        type: boolean
        default: true

jobs:
  provision:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
      BACKEND_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
      SVC: ${{ inputs.service_name }}
      # What the agent needs to answer a call. Only the first is available today; the other two are
      # reported as missing rather than substituted, because a wrong CARTESIA_TOOL_SECRET is a
      # service that boots, answers, and fails every tool call with an auth error.
      # The backend's Railway host, verified by its own /health answering there, as the fallback
      # when no PUBLIC_BACKEND_URL secret is set — which was the case on the first provisioning run,
      # so the service came up unable to reach Tori. Not a guess and not a secret; override it with
      # the secret or variable when the API moves to its own domain.
      TORI_API_URL: ${{ secrets.PUBLIC_BACKEND_URL || vars.PUBLIC_BACKEND_URL || 'https://hairsalonwhatsappbot.up.railway.app' }}
      CARTESIA_TOOL_SECRET: ${{ secrets.CARTESIA_TOOL_SECRET || vars.CARTESIA_TOOL_SECRET }}
      # Every name the agent will accept, from both stores. "Secrets and variables" is one page with
      # two tabs and a value in the wrong one resolves to an empty string with no warning — which is
      # exactly what happened here: the key was added, MODEL_KEY still arrived empty, and the
      # service kept reporting model_key:false. main.py reads TORI_AGENT_API_KEY first, then
      # ANTHROPIC_API_KEY, so both names are legitimate and both are accepted.
      # When none of the four holds anything, the step below falls back to the key the backend
      # service is already running on — see the note there.
      MODEL_KEY: >-
        ${{ secrets.ANTHROPIC_API_KEY || vars.ANTHROPIC_API_KEY
         || secrets.TORI_AGENT_API_KEY || vars.TORI_AGENT_API_KEY }}
      AGENT_GENDER: ${{ secrets.TORI_AGENT_GENDER || vars.TORI_AGENT_GENDER || 'masculine' }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to touch the backend's service
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ -z "$SVC" ]; then
            echo "::error::service_name is empty. An empty --service makes the CLI pick, and the project's other service is the backend."
            exit 1
          fi
          if [ "$SVC" = "$BACKEND_SERVICE" ]; then
            echo "::error::'$SVC' is the backend's service. Deploying the voice agent onto it would take the API down for every salon."
            exit 1
          fi
          echo "Target service: $SVC (backend is '$BACKEND_SERVICE', untouched)"

      - name: Install the Railway CLI
        run: npm i -g @railway/cli

      - name: Create the service if it does not exist
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          # Every name anywhere in the payload: the CLI has reported "multiple services" while
          # .services.edges held one entry, so the shape is not what it looks like and a narrow
          # query here is how you end up deploying onto the wrong service.
          existing=$(railway status --json 2>/dev/null | jq -r '[.. | objects | select(has("name")) | .name] | unique | .[]' || true)
          echo "Names visible to this token:"; echo "$existing" | sed 's/^/  - /'

          if echo "$existing" | grep -qx "$SVC"; then
            echo "'$SVC' already exists — reusing it."
            exit 0
          fi

          # `railway up` works off the token alone, but `railway add` does not: the first attempt
          # answered its own prompts from the flags and then died on "Project not found. Run
          # `railway link`". Authenticating to a project and having a project selected are separate
          # states in this CLI, and only the second one creates services.
          if ! railway link --project "$PROJECT" --environment "$RAILWAY_ENVIRONMENT"; then
            echo "::error::Could not link project '$PROJECT'. Re-run with the project name exactly as `railway status` prints it — the names this token can see are listed above."
            exit 1
          fi

          railway add --service "$SVC"
          echo "Created '$SVC'."

      - name: Set the variables the agent reads
        run: |
          args="--service $SVC --environment $RAILWAY_ENVIRONMENT --skip-deploys"
          missing=""

          # Railway variables are per service, not per project. The model key has been in this
          # project for a month — on the backend, which is the service that has been using it. The
          # voice agent is a different service and was created empty, so "the key is in Railway"
          # and "model_key: false" are both true at once, and neither is the other's contradiction.
          #
          # So: names present on each service, which is the evidence for that claim rather than the
          # assertion of it. Names only. The values here are live API keys.
          echo "Variables on '$BACKEND_SERVICE' (names only):"
          backend_vars=$(railway variables --service "$BACKEND_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --json 2>/dev/null || echo '{}')
          printf '%s' "$backend_vars" | jq -r 'keys[]' 2>/dev/null | sed 's/^/  - /' || echo "  (could not read)"
          echo "Variables on '$SVC' (names only):"
          railway variables --service "$SVC" --environment "$RAILWAY_ENVIRONMENT" --json 2>/dev/null \
            | jq -r 'keys[]' 2>/dev/null | sed 's/^/  - /' || echo "  (none yet)"

          # If GitHub holds no key, take the one the backend is already using. Copying it inside the
          # project beats asking for it again: it is the same account, the same key, and a second
          # copy pasted by hand is a second thing to rotate and a chance to paste it wrong.
          copied=""
          if [ -z "$MODEL_KEY" ]; then
            for name in TORI_AGENT_API_KEY ANTHROPIC_API_KEY; do
              found=$(printf '%s' "$backend_vars" | jq -r --arg n "$name" '.[$n] // ""' 2>/dev/null || echo "")
              if [ -n "$found" ]; then
                # Before it is used anywhere. Masking is what keeps a stray CLI error message from
                # printing the key back into a public build log.
                echo "::add-mask::$found"
                MODEL_KEY="$found"
                copied="$name on $BACKEND_SERVICE"
                break
              fi
            done
          fi

          if [ -n "$TORI_API_URL" ]; then railway variables --set "TORI_API_URL=$TORI_API_URL" $args
          else missing="$missing PUBLIC_BACKEND_URL→TORI_API_URL"; fi

          if [ -n "$CARTESIA_TOOL_SECRET" ]; then railway variables --set "CARTESIA_TOOL_SECRET=$CARTESIA_TOOL_SECRET" $args
          else missing="$missing CARTESIA_TOOL_SECRET"; fi

          if [ -n "$MODEL_KEY" ]; then
            railway variables --set "ANTHROPIC_API_KEY=$MODEL_KEY" $args
            # `if`, not `[ … ] && echo`: a false test as the last command of an AND-list is the
            # step's exit status under `bash -e`, which failed a step here once after it had done
            # everything correctly.
            if [ -n "$copied" ]; then
              echo "::notice::Model key taken from $copied — GitHub holds none under any name the agent reads."
            fi
          else missing="$missing ANTHROPIC_API_KEY"; fi

          railway variables --set "TORI_AGENT_GENDER=$AGENT_GENDER" $args

          if [ -n "$missing" ]; then
            echo "::warning::Not set, because nothing holds them — not GitHub, and not the backend service:$missing"
            echo "::warning::The service will boot and fail every call until they exist. CARTESIA_TOOL_SECRET must match the backend's exactly, and neither can be guessed from here."
            # Which names were actually found, as booleans. A key that is present under a name
            # nothing reads looks identical to no key at all, and the first round of this cost a
            # deploy cycle to notice. Names only — never a value, not even a length.
            echo "Names checked for the model key (true = found):"
            echo "  secrets.ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY != '' }}    vars.ANTHROPIC_API_KEY=${{ vars.ANTHROPIC_API_KEY != '' }}"
            echo "  secrets.TORI_AGENT_API_KEY=${{ secrets.TORI_AGENT_API_KEY != '' }}   vars.TORI_AGENT_API_KEY=${{ vars.TORI_AGENT_API_KEY != '' }}"
            echo "The backend's own variable names are listed above — if the key is there under a third name, add that name to this step."
          fi

      - name: Upload and build voice-agent/
        if: inputs.deploy
        working-directory: voice-agent
        run: |
          # `railway up --ci` exits 1 on "Failed to stream build logs" as readily as on a failed
          # build, and the two mean opposite things: one is a broken log pipe over a build that was
          # accepted and is running, the other is code that never shipped. Treating them alike
          # skipped the health check — the one step that can actually tell them apart — and left
          # the run reporting failure over a deploy that had gone out.
          if ! railway up --ci --service "$SVC" --environment "$RAILWAY_ENVIRONMENT"; then
            echo "::warning::'railway up' exited non-zero. If that was a log-streaming error the build is still running; the health check below is the verdict."
          fi

      # always(), so a non-zero `railway up` cannot suppress the only reading that distinguishes a
      # failed build from a failed log stream.
      - name: Give it a public URL and report what booted
        if: always() && inputs.deploy
        run: |
          # Cartesia dials this host, so the service needs a domain before it can be pointed at.
          out=$(railway domain --service "$SVC" --environment "$RAILWAY_ENVIRONMENT" 2>&1) || true
          echo "$out"

          # From the domain command's own output, not from `railway status`. Scraping status for
          # the first *.up.railway.app returned the *backend's* host, and the health check then
          # reported on the wrong service entirely — a green-looking answer about something nobody
          # asked about. The command that just created this service's domain is the one that knows
          # which domain that is.
          url=$(printf '%s' "$out" | grep -oE 'https://[a-z0-9.-]+\.up\.railway\.app' | head -1 || true)
          if [ -z "$url" ]; then
            echo "::warning::Could not read the domain from 'railway domain' output. Read it off the Railway dashboard."
            exit 0
          fi
          host=${url#https://}

          echo "URL: $url"
          # /health exists to answer "which code is live, and is it configured" in one request.
          # Retried: a fresh deploy is not serving the instant the build reports done.
          for i in 1 2 3 4 5 6; do
            body=$(curl -sS --max-time 10 "https://$host/health" || true)
            if echo "$body" | jq -e '.ok' >/dev/null 2>&1; then
              echo "$body" | jq .
              # One field, computed by the service itself, rather than re-deriving the answer here
              # from parts. An earlier version checked tori_api and tool_secret and would have
              # called a service ready while it had no model key — which is a service that answers
              # the phone and goes silent building the agent.
              if [ "$(echo "$body" | jq -r '.ready_for_calls')" = "true" ]; then
                echo "::notice::Ready. Run 'Fix Cartesia agent config' with deployment_url=$url to remove the cold start."
              else
                echo "::warning::Booted but not ready for calls. Do NOT point Cartesia at it — the false fields above say what is missing."
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::/health did not answer within a minute. The build may still be starting; re-check https://$host/health."
