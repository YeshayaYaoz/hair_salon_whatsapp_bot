name: Read Cartesia's own usage

# What Cartesia thinks we have spent, from Cartesia — as opposed to what our ledger measured.
#
# The account's prepaid agent dollars ran out without any warning reaching us, because the number
# that matters (minutes of live call at $0.06 each) was only ever visible by logging into their
# console. The API key lives in GitHub Secrets and cannot be read from a laptop, so the request
# that answers "how close are we to the limit" runs here.
#
# Read-only. It never changes anything on the account.
#
# Caller phone numbers are personal data and are never printed: the shape of a record is dumped by
# key name, and everything else is a count, a duration, or a date.
on:
  workflow_dispatch:
    inputs:
      shape_only:
        description: "Print the field names of one record instead of the numbers (for wiring this into the admin panel)"
        type: boolean
        default: false
      check_ledger:
        description: "Also read our own database — did the calls Cartesia lists actually land here"
        type: boolean
        default: true
      call_id:
        description: "Fetch one call's runtime logs (ac_...) — what a tool was actually handed, when a call did something unexpected"
        type: string
        default: ""

jobs:
  usage:
    runs-on: ubuntu-latest
    env:
      KEY: ${{ secrets.CARTESIA_API_KEY || vars.CARTESIA_API_KEY }}
      AGENT: ${{ secrets.CARTESIA_AGENT_ID || vars.CARTESIA_AGENT_ID }}
      API: https://api.cartesia.ai
      VERSION: "2026-03-01"
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
      BACKEND_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
    steps:
      - uses: actions/checkout@v4

      - name: Ask Cartesia
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::CARTESIA_API_KEY is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi

          # The account's own consumption, bucketed over time. This is the reading that did not
          # exist anywhere in the product when the prepaid balance ran out — the calls list below
          # says what was spent, these say how much is left to spend it from.
          for path in "/usage/agents" "/usage/credits"; do
            echo "── GET $path"
            code=$(curl -sS -o /tmp/u.json -w '%{http_code}' "$API$path" \
              -H "Authorization: Bearer $KEY" -H "Cartesia-Version: $VERSION" || echo "000")
            echo "   HTTP $code"
            if [ "$code" = "200" ]; then
              echo "   keys: $(jq -rc 'if type == "array" then ["(array)"] else keys end' /tmp/u.json)"
              # Money and counts only. Whatever the field names turn out to be, this prints the
              # first two buckets in full — there is nothing personal in an aggregate.
              jq -rc 'if type == "array" then .[0:2] else (.data? // .buckets? // .)[0:2]? // . end' /tmp/u.json | head -c 900
              echo
            else
              echo "   $(jq -r '.title // .message // ""' /tmp/u.json 2>/dev/null | head -c 160)"
            fi
          done

          # /agents/calls is a real route — unauthenticated it answers 401, while /calls without the
          # prefix answers 404 — and with the key it answers "Missing agent ID". So the agent is a
          # parameter, and these are the two ways an API of this shape usually takes one. Both are
          # tried rather than guessed at, since a wrong guess and an empty account look alike.
          for path in "/agents/$AGENT/calls?limit=5" "/agents/calls?agent_id=$AGENT&limit=5"; do
            echo "── GET $path"
            code=$(curl -sS -o /tmp/out.json -w '%{http_code}' "$API$path" \
              -H "Authorization: Bearer $KEY" -H "Cartesia-Version: $VERSION" || echo "000")
            echo "   HTTP $code"
            if [ "$code" != "200" ]; then
              echo "   $(jq -r '.title // .message // ""' /tmp/out.json 2>/dev/null | head -c 200)"
              continue
            fi

            # Names and structure, never values: one of these responses is a list of real calls
            # from real people.
            echo "   top-level keys: $(jq -rc 'if type == "array" then ["(array)"] else keys end' /tmp/out.json)"
            n=$(jq -r 'if type == "array" then length elif (.data? | type) == "array" then (.data | length) else 0 end' /tmp/out.json)
            echo "   records: $n"
            if [ "$n" -gt 0 ]; then
              echo "   record fields: $(jq -rc 'if type == "array" then .[0] else .data[0] end | keys' /tmp/out.json)"
            fi

            # Which salon a call belongs to has to come from the number that was dialled — one
            # shared agent answers for every business — so the field carrying it is named here.
            # Key names only: the values are real phone numbers.
            echo "   telephony_params fields: $(jq -rc '(if type == "array" then .[0] else .data[0] end).telephony_params | if type == "object" then keys else type end' /tmp/out.json 2>/dev/null || echo '?')"

            if [ "${{ inputs.shape_only }}" != "true" ]; then
              # There is no duration field — a call is a start_time and an end_time, and the
              # billable minutes are the difference. That subtraction is the whole point of this.
              #
              # fromdateiso8601 parses exactly "…:SSZ": it rejects the fractional seconds and the
              # "+00:00" offset these timestamps actually carry, and jq's failure there is silent
              # enough that the first run of this printed a column of "?" instead of an error.
              jq -r '
                def secs: sub("\\.[0-9]+"; "") | sub("\\+00:00$"; "Z") | fromdateiso8601;
                (if type == "array" then . else .data end)
                | map(select(.end_time) | { start: .start_time, d: ((.end_time | secs) - (.start_time | secs)), s: "\(.status)/\(.end_reason // "-")" })
                | (.[] | "   \(.start)  \(.d)s  \(.s)"),
                  "   ── \(length) ended call(s), \(map(.d) | add // 0)s total, $\((map(.d / 60 | ceil) | add // 0) * 0.06 | . * 100 | round / 100)"
              ' /tmp/out.json || true
            fi
          done

      # The other half of the question. Reading Cartesia's API proves what Cartesia knows; it says
      # nothing about whether the webhook landed here. `railway run` injects the backend service's
      # own variables, so this queries the same database production does — without a copy of
      # DATABASE_URL existing anywhere outside Railway.
      - name: Did those calls land in our ledger
        if: inputs.check_ledger
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN is not set — cannot read our side."
            exit 0
          fi
          npm i -g @railway/cli
          cd backend
          # Dev dependencies included on purpose: tsx and the Prisma CLI are both dev deps, and
          # the probe is a TypeScript file run through tsx.
          npm ci --no-audit --no-fund >/dev/null 2>&1 || npm install --no-audit --no-fund >/dev/null 2>&1
          npx prisma generate >/dev/null 2>&1
          railway run --service "$BACKEND_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/voice-usage-probe.ts 10

      # Why a call did what it did, from the runtime's own log rather than from the LLM's summary of
      # it. The summary said photos "could not be sent to email"; only this says what the tool was
      # handed and what it answered.
      #
      # This log contains the conversation, including whatever a caller read out — an address, a
      # name. It is printed only when a call is named explicitly, and only the lines that mention a
      # tool or an error, so asking about one call does not dump a customer's conversation into a
      # build log.
      - name: One call's runtime logs
        if: inputs.call_id != ''
        env:
          CALL_ID: ${{ inputs.call_id }}
        run: |
          code=$(curl -sS -o /tmp/logs.json -w '%{http_code}' "$API/agents/calls/$CALL_ID/logs" \
            -H "Authorization: Bearer $KEY" -H "Cartesia-Version: $VERSION" || echo "000")
          echo "GET /agents/calls/$CALL_ID/logs → $code"
          if [ "$code" != "200" ]; then
            echo "  $(jq -r '.title // .message // ""' /tmp/logs.json 2>/dev/null | head -c 200)"
            # "Call logs not available" is the answer for a self-hosted agent: the runtime is our
            # Railway service, so those logs were never Cartesia's to keep. The call's own
            # transcript is, and each turn carries the tool calls made in it — which is the part
            # that actually answers "what was this tool handed".
            echo "── falling back to the transcript's tool calls"
            ccode=$(curl -sS -o /tmp/call.json -w '%{http_code}' "$API/agents/calls/$CALL_ID" \
              -H "Authorization: Bearer $KEY" -H "Cartesia-Version: $VERSION" || echo "000")
            echo "GET /agents/calls/$CALL_ID → $ccode"
            if [ "$ccode" = "200" ]; then
              # Tool calls only — never the turn text. The arguments are what the model built out of
              # what it heard, which is the whole question; the conversation around them is not.
              jq -rc '[.transcript[]? | select(.tool_calls) | .tool_calls[]?] | if length == 0 then "(no tool calls recorded on this call)" else .[] end' /tmp/call.json | head -20
            fi
            exit 0
          fi

          echo "  top-level: $(jq -rc 'if type == "array" then ["(array)"] else keys end' /tmp/logs.json)"
          # Whatever shape the logs come in, reduce to text lines and keep the ones about tools and
          # failures. `tostring` rather than a field guess: one unknown key name should not turn
          # this into an empty result.
          jq -r '[.. | strings] | .[]' /tmp/logs.json 2>/dev/null \
            | grep -iE 'send.?details|tool|error|fail|invalid|400|409|email' \
            | head -40 || echo "  (nothing matching tool or error lines)"

