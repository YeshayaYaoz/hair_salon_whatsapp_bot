name: Rotate the voice secrets

# Two secrets guard the voice stack, and only one of them can be rotated from here.
#
#   CARTESIA_TOOL_SECRET — ours. The bearer the voice agent sends when it calls the API mid-call
#     (POST /api/voice/context and every other tool). Despite the name Cartesia never holds it: the
#     agent is self-hosted, so both ends of this secret are Railway services in one project. Nobody
#     needs to know its value, which means it can be replaced with a fresh random string entirely by
#     machine — that is what this workflow does.
#
#   CARTESIA_API_KEY — theirs. Issued by Cartesia's console, and replacing it means creating a new
#     key in an account this workflow cannot log into. The probe step below establishes, rather than
#     assumes, whether their API will do it with the key itself as credentials.
#
# The rotation is ordered so that no live call breaks. Both ends hold the secret as a Railway
# variable, and changing a variable restarts a service, so they cannot switch over at the same
# instant. The API is therefore taught the new value *while it still accepts the old one*
# (CARTESIA_TOOL_SECRET_PREVIOUS, honoured by requireCartesiaAuth in backend/src/api/voiceRoutes.ts),
# and only then is the agent moved. There is no window in which the pair disagrees.
#
# Nothing here prints a secret. The generated value is masked before it is used, the old value is
# masked the moment it is read, and the verification is an HTTP status code.
on:
  workflow_dispatch:
    inputs:
      probe_api_key_rotation:
        description: "Check whether Cartesia's API can rotate CARTESIA_API_KEY (read-only)"
        type: boolean
        default: true
      rotate_tool_secret:
        description: "Replace CARTESIA_TOOL_SECRET on both services with a fresh random value"
        type: boolean
        default: false
      drop_previous:
        description: "Stop accepting the pre-rotation secret (run once the rotation is confirmed)"
        type: boolean
        default: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
      BACKEND_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
      VOICE_SERVICE: ${{ secrets.VOICE_AGENT_SERVICE || vars.VOICE_AGENT_SERVICE || 'tori-voice-agent' }}
      BACKEND_URL: ${{ secrets.PUBLIC_BACKEND_URL || vars.PUBLIC_BACKEND_URL || 'https://hairsalonwhatsappbot.up.railway.app' }}
      CARTESIA_KEY: ${{ secrets.CARTESIA_API_KEY || vars.CARTESIA_API_KEY }}
      API: https://api.cartesia.ai
      VERSION: "2026-03-01"
    steps:
      # Read-only, and deliberately first: if Cartesia's key-management API answers to the key
      # itself, that changes who has to do the other half of this job. Status codes only — a 200
      # body lists the account's keys.
      - name: Can the Cartesia key rotate itself
        if: inputs.probe_api_key_rotation
        run: |
          if [ -z "$CARTESIA_KEY" ]; then
            echo "::warning::No CARTESIA_API_KEY in GitHub — nothing to probe with."
            exit 0
          fi
          for scheme in "Authorization: Bearer $CARTESIA_KEY" "X-API-Key: $CARTESIA_KEY"; do
            name=${scheme%%:*}
            code=$(curl -sS -o /tmp/probe.json -w '%{http_code}' "$API/api-keys" \
              -H "$scheme" -H "Cartesia-Version: $VERSION" || echo "000")
            echo "GET /api-keys with $name → $code"
            if [ "$code" = "200" ]; then
              echo "::notice::$name works. Key rotation is automatable: create a key over the API, put it on Railway, delete the old one."
              # A count, not the list. Each entry names and dates a live credential.
              echo "  keys visible: $(jq -r 'if type == "array" then length elif has("data") then (.data | length) else "?" end' /tmp/probe.json 2>/dev/null || echo '?')"
              exit 0
            fi
            # The endpoint's own words for the refusal, which is the whole point of the probe. It
            # carries no credential — an unauthenticated request gets the same sentence.
            echo "  $(jq -r '.title // .message // ""' /tmp/probe.json 2>/dev/null | head -c 120)"
          done
          echo "::warning::Cartesia's key API does not accept the API key as credentials — it wants a logged-in console session. Rotating CARTESIA_API_KEY is a human step in the Cartesia dashboard."

      - name: Is Railway reachable
        if: inputs.rotate_tool_secret || inputs.drop_previous
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          if [ "$BACKEND_SERVICE" = "$VOICE_SERVICE" ]; then
            echo "::error::BACKEND_SERVICE and VOICE_AGENT_SERVICE name the same service — one of them is wrong, and rotating against it would break the pairing rather than move it."
            exit 1
          fi
          npm i -g @railway/cli
          echo "Services: backend='$BACKEND_SERVICE', agent='$VOICE_SERVICE', env='$RAILWAY_ENVIRONMENT'"

      # One command, so the backend restarts once already holding both values. Split across two
      # commands it restarts twice, and the first of those restarts is a service that has forgotten
      # the old secret and not yet been paired with the new one.
      - name: Teach the API the new secret, without it forgetting the old one
        if: inputs.rotate_tool_secret
        run: |
          new=$(openssl rand -hex 32)
          echo "::add-mask::$new"

          # Masked before anything else can echo it — a CLI error message quoting the variable it
          # failed on is how a value ends up in a public log.
          old=$(railway variables --service "$BACKEND_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --json 2>/dev/null \
            | jq -r '.CARTESIA_TOOL_SECRET // ""' || echo "")
          if [ -n "$old" ]; then
            echo "::add-mask::$old"
            echo "Current secret found on $BACKEND_SERVICE (${#old} chars) — it will stay valid until 'drop_previous'."
          else
            echo "::warning::$BACKEND_SERVICE has no CARTESIA_TOOL_SECRET to carry over. If the agent is live, its calls will 401 until the next step lands."
          fi

          railway variables --service "$BACKEND_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            --set "CARTESIA_TOOL_SECRET=$new" --set "CARTESIA_TOOL_SECRET_PREVIOUS=$old"

          # Kept for the following steps only. GITHUB_ENV is not readable outside this job, and the
          # value is masked in every log line either way.
          echo "NEW_SECRET=$new" >> "$GITHUB_ENV"

          echo "Waiting for the API to come back on the new variables…"
          for i in $(seq 1 30); do
            body=$(curl -sS --max-time 10 "$BACKEND_URL/health" 2>/dev/null || true)
            if echo "$body" | jq -e '.ok' >/dev/null 2>&1; then
              echo "API is up: $(echo "$body" | jq -rc '{commit, startedAt}')"
              exit 0
            fi
            sleep 10
          done
          echo "::error::/health did not answer within five minutes. The agent has NOT been moved — the old secret is still live, so calls keep working. Investigate before re-running."
          exit 1

      # Proof before the agent is touched, because this is the step whose failure is silent: a
      # secret that did not take produces an API that answers /health perfectly and 401s every tool
      # call. 401 here would mean the variable never landed.
      - name: Prove the API accepts the new secret
        if: inputs.rotate_tool_secret
        run: |
          probe() {
            curl -sS -o /dev/null -w '%{http_code}' --max-time 15 -X POST "$BACKEND_URL/api/voice/context" \
              -H "Authorization: Bearer $1" -H "Content-Type: application/json" \
              --data '{"calledNumber":"+972500000000","callerNumber":"+972500000001"}' || echo "000"
          }
          # An unassigned number, so the answer is "no such business" rather than anything real:
          # what is being tested is which side of the auth check the request lands on.
          good=$(probe "$NEW_SECRET")
          bad=$(probe "definitely-not-the-secret")
          echo "new secret → $good    garbage → $bad"
          if [ "$good" = "401" ]; then
            echo "::error::The API still rejects the new secret. Do not move the agent — re-run, or set CARTESIA_TOOL_SECRET on $BACKEND_SERVICE by hand."
            exit 1
          fi
          if [ "$bad" != "401" ]; then
            echo "::error::The API accepted a garbage bearer. Auth is not doing its job; stop here."
            exit 1
          fi
          echo "::notice::The API is on the new secret and still refuses everything else."

      - name: Move the agent onto it
        if: inputs.rotate_tool_secret
        run: |
          railway variables --service "$VOICE_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            --set "CARTESIA_TOOL_SECRET=$NEW_SECRET"

          out=$(railway domain --service "$VOICE_SERVICE" --environment "$RAILWAY_ENVIRONMENT" 2>&1) || true
          url=$(printf '%s' "$out" | grep -oE 'https://[a-z0-9.-]+\.up\.railway\.app' | head -1 || true)
          if [ -z "$url" ]; then
            echo "::warning::Could not read the agent's domain. Both services have the new secret; check its /health by hand."
            exit 0
          fi
          echo "Waiting for the agent to restart on the new secret…"
          for i in $(seq 1 30); do
            body=$(curl -sS --max-time 10 "$url/health" 2>/dev/null || true)
            if echo "$body" | jq -e '.ok' >/dev/null 2>&1; then
              echo "$body" | jq .
              if [ "$(echo "$body" | jq -r '.ready_for_calls')" = "true" ]; then
                echo "::notice::Rotated. Place one test call, then re-run this workflow with drop_previous to retire the old secret."
              else
                echo "::error::The agent booted but is not ready for calls — the false fields above say what is missing."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::The agent's /health did not answer within five minutes. Both variables are set; check $url/health."

      # Separate run, on purpose. Until this happens the old secret still opens the API, which is
      # what makes the rotation reversible — and it is also, until this happens, only half a
      # rotation. Emptied rather than deleted: Railway keeps a variable set to "" either way, and
      # requireCartesiaAuth trims and discards blanks precisely so that is equivalent to unset.
      - name: Retire the pre-rotation secret
        if: inputs.drop_previous
        run: |
          railway variables --service "$BACKEND_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            --set "CARTESIA_TOOL_SECRET_PREVIOUS="
          echo "Waiting for the API to come back…"
          for i in $(seq 1 30); do
            body=$(curl -sS --max-time 10 "$BACKEND_URL/health" 2>/dev/null || true)
            if echo "$body" | jq -e '.ok' >/dev/null 2>&1; then
              echo "API is up: $(echo "$body" | jq -rc '{commit, startedAt}')"
              echo "::notice::Only the current secret opens the API now."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::/health did not answer within five minutes — check $BACKEND_URL/health."
