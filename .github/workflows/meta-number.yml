name: Tori number on Tori's WABA

# Drives scripts/meta-add-number.ts, one step per run. The credentials are Actions secrets rather
# than Railway env, so this needs no railway run.
#
# Manual only, and one step at a time on purpose: each step's outcome decides whether the next one
# is the right thing to do at all — a display name can be declined while the line verifies fine, and
# registering a number that failed verification just produces a confusing error.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Which step to run"
        type: choice
        options: [status, list, templates, library, discover-templates, wiring, submit-outreach-template, resubmit-templates, send-templates, payment-method-notice, add, rename, remove, request-code, verify, verify-from-call, register]
        default: status
      number:
        description: "Number in international format"
        default: "+972559450126"
      waba:
        description: "WABA id — blank uses Tori's own. A customer's number lives on the customer's WABA."
        default: ""
      name:
        description: "Display name (add / rename) — Meta reviews this separately from the line"
        default: "תורי-אונליין"
      code:
        description: "Six-digit code (verify only)"
        default: ""
      code_method:
        description: "How to receive the code (request-code only)"
        type: choice
        options: [SMS, VOICE]
        default: SMS
      business:
        description: "Business id (resubmit-templates / send-templates) — blank lists them"
        default: ""
      to:
        description: "Recipient (send-templates) — blank uses the business's own notification phone"
        default: ""
      greeting:
        description: "Who to greet (payment-method-notice) — blank uses the business name"
        default: ""
      confirm:
        description: "Actually submit or send. Unticked prints what would happen and stops."
        type: boolean
        default: false

jobs:
  run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: ${{ inputs.action }}
        env:
          META_SYSTEM_USER_TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
          TORI_WABA_ID: ${{ secrets.TORI_WABA_ID }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
          ACTION: ${{ inputs.action }}
          NUMBER: ${{ inputs.number }}
          WABA: ${{ inputs.waba }}
          NAME: ${{ inputs.name }}
          CODE: ${{ inputs.code }}
          CODE_METHOD: ${{ inputs.code_method }}
          BUSINESS: ${{ inputs.business }}
          TO: ${{ inputs.to }}
          GREETING: ${{ inputs.greeting }}
          CONFIRM: ${{ inputs.confirm && 'yes' || '' }}
        run: |
          # Single-use and short-lived, but a verification code in a build log is still a
          # credential sitting where anyone with repo read access can find it later.
          [ -n "$CODE" ] && echo "::add-mask::$CODE"

          # An array, not a string. A display name has a space in it ("תורי אונליין"), and an
          # unquoted string expansion splits on it — Meta received "תורי" and put *that* under
          # review. It succeeds loudly, with the wrong value, and the only place the truth shows up
          # is the review queue days later.
          case "$ACTION" in
            status)       args=() ;;
            list)         args=(--list) ;;
            # Handled further down by a different script; nothing to build here.
            templates|library|discover-templates|wiring|submit-outreach-template|resubmit-templates|send-templates|payment-method-notice) args=() ;;
            add)          args=(--name "$NAME") ;;
            rename)       args=(--rename "$NAME") ;;
            # The script refuses on a CONNECTED or VERIFIED line regardless; --force is deliberately
            # not reachable from here, so no dispatch of this workflow can detach a working number.
            remove)       args=(--remove --confirm) ;;
            request-code) args=(--request-code --code-method "$CODE_METHOD") ;;
            verify)
              [ -z "$CODE" ] && { echo "::error::'verify' needs the code input."; exit 1; }
              args=(--verify "$CODE") ;;
            verify-from-call)
              # The whole point of taking the code by voice: nobody reads it, types it, or pastes
              # it anywhere. It goes from Cartesia's transcript straight into Meta's verify call,
              # and is masked before either step prints anything.
              # --whisper, not the agent's own transcript: Cartesia's Hebrew speech recognition
              # renders Meta's English digit-by-digit reading as "9, זירו zero, 8" and scatters it
              # over seven turns, which produced three different reconstructions of one code.
              # Through railway run: CARTESIA_API_KEY and OPENAI_API_KEY live in Railway, not in
              # Actions secrets, and duplicating them here would be two places to rotate and one to
              # forget. Meta's own credentials stay Actions secrets because nothing else needs them.
              npm i -g @railway/cli >/dev/null 2>&1
              CODE=$(railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
                npx tsx scripts/cartesia-code.ts --to "$NUMBER" --whisper 2>&1 \
                | grep -oE 'code: [0-9]{6}' | grep -oE '[0-9]{6}' | tail -1)
              [ -z "$CODE" ] && { echo "::error::No six-digit code found in recent calls to $NUMBER."; exit 1; }
              echo "::add-mask::$CODE"
              echo "Read a code out of the call transcript."
              args=(--verify "$CODE") ;;
            register)     args=(--register) ;;
            *)            echo "::error::Unknown action '$ACTION'"; exit 1 ;;
          esac

          waba_args=()
          [ -n "$WABA" ] && waba_args=(--waba "$WABA")

          # Templates are a property of the WABA, not of one number, so they run a different script.
          case "$ACTION" in
            templates) npx tsx scripts/meta-templates.ts "${waba_args[@]}"; exit $? ;;
            library)   npx tsx scripts/meta-templates.ts --library "${waba_args[@]}"; exit $? ;;
            discover-templates) npx tsx scripts/meta-templates.ts --discover "${waba_args[@]}"; exit $? ;;
            # --confirm from here: the dispatch itself is the deliberate act, and the script prints
            # the full body before sending either way.
            submit-outreach-template)
              npx tsx scripts/submit-outreach-template.ts --confirm
              exit $? ;;
            # Needs the database. Without --confirm it prints the four bodies and submits nothing,
            # so a dispatch with an empty business input is a dry run rather than an accident.
            resubmit-templates)
              npm i -g @railway/cli >/dev/null 2>&1
              railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
                npx tsx scripts/resubmit-templates.ts ${BUSINESS:+--business "$BUSINESS"} ${CONFIRM:+--confirm}
              exit $? ;;
            # Sends real messages to a real handset from the business's own number, so --confirm is
            # what separates "show me what would go out" from "put it on someone's phone".
            send-templates)
              [ -z "$BUSINESS" ] && { echo "::error::'send-templates' needs the business input (or 'tori')."; exit 1; }
              # "tori" as the business id sends from Tori's own number. Useful while a business's
              # own copies are still in review — same submission, so the rendered result is what
              # that business will send once approved.
              if [ "$BUSINESS" = "tori" ]; then who=(--tori); else who=(--business "$BUSINESS"); fi
              npm i -g @railway/cli >/dev/null 2>&1
              railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
                npx tsx scripts/send-business-templates.ts "${who[@]}" ${TO:+--to "$TO"} ${CONFIRM:+--confirm}
              exit $? ;;
            # Sends one owner a real message about their own account, so it checks the account
            # first: the script refuses outright if a card IS saved rather than claiming otherwise.
            payment-method-notice)
              [ -z "$BUSINESS" ] && { echo "::error::'payment-method-notice' needs the business input."; exit 1; }
              npm i -g @railway/cli >/dev/null 2>&1
              railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
                npx tsx scripts/send-payment-method-notice.ts --business "$BUSINESS" \
                  ${TO:+--to "$TO"} ${GREETING:+--name "$GREETING"} ${CONFIRM:+--confirm}
              exit $? ;;
            # Needs the database, which lives in Railway rather than in Actions secrets.
            wiring)
              npm i -g @railway/cli >/dev/null 2>&1
              railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
                npx tsx scripts/whatsapp-wiring.ts
              exit $? ;;
          esac

          npx tsx scripts/meta-add-number.ts --number "$NUMBER" "${waba_args[@]}" "${args[@]}"
