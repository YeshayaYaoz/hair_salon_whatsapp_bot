name: Check Meta access

# Read-only. Answers three questions that are otherwise guesswork from outside Meta's console:
# whether the token works at all, what it is actually allowed to do, and which templates already
# exist on the WABA. Nothing here creates, edits or sends anything.
#
# Manual only — this is a diagnostic, not something a push should trigger.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.META_SYSTEM_USER_TOKEN }}
      WABA: ${{ secrets.TORI_WABA_ID }}
      APP_ID: ${{ secrets.META_APP_ID || vars.META_APP_ID }}
      GRAPH: https://graph.facebook.com/v23.0
    steps:
      - name: Is anything configured
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing META_SYSTEM_USER_TOKEN"
          [ -z "$WABA" ] && missing="$missing TORI_WABA_ID"
          if [ -n "$missing" ]; then
            echo "::error::Not set:$missing — add under Settings → Secrets and variables → Actions → Secrets."
            exit 1
          fi

      # The first thing to establish, because the two are easy to confuse in Meta's UI: the System
      # User's *ID* is displayed on the system user page, while the *token* is shown once, behind
      # the "Generate token" button. Pasting the former produces an authentication error that reads
      # like a permissions problem.
      - name: Does the token work, and what may it do
        run: |
          out=$(curl -sS "$GRAPH/debug_token?input_token=$TOKEN&access_token=$TOKEN")
          if echo "$out" | jq -e '.error' >/dev/null; then
            echo "::error::Meta rejected the token: $(echo "$out" | jq -r '.error.message')"
            echo "If that says the session is invalid, the value is probably the System User ID rather than a generated token."
            exit 1
          fi
          echo "Token type:  $(echo "$out" | jq -r '.data.type')"
          echo "App:         $(echo "$out" | jq -r '.data.app_id')"
          # 0 means never expires, which is the point of a System User token — a token that expires
          # takes the reminders down silently in sixty days.
          echo "Expires at:  $(echo "$out" | jq -r '.data.expires_at') (0 = never)"
          echo "Scopes:"
          echo "$out" | jq -r '.data.scopes[]? | "  - " + .'
          echo "$out" | jq -e '.data.scopes | index("whatsapp_business_management")' >/dev/null \
            || echo "::warning::whatsapp_business_management is NOT granted — this token cannot create message templates."

      - name: Can it see the WhatsApp account
        run: |
          out=$(curl -sS "$GRAPH/$WABA?fields=id,name,currency,timezone_id&access_token=$TOKEN")
          if echo "$out" | jq -e '.error' >/dev/null; then
            echo "::error::Cannot read the WABA: $(echo "$out" | jq -r '.error.message')"
            echo "A token that authenticates but cannot read the WABA usually means the WhatsApp account was not assigned to the System User — assign it alongside the app."
            exit 1
          fi
          echo "WABA name: $(echo "$out" | jq -r '.name')"

      - name: Which phone numbers are on it
        run: |
          curl -sS "$GRAPH/$WABA/phone_numbers?fields=display_phone_number,verified_name,quality_rating&access_token=$TOKEN" \
            | jq -r '.data[]? | "  - \(.display_phone_number)  \(.verified_name)  quality=\(.quality_rating // "n/a")"'

      - name: Which templates already exist
        run: |
          out=$(curl -sS "$GRAPH/$WABA/message_templates?fields=name,status,category,language&limit=100&access_token=$TOKEN")
          if echo "$out" | jq -e '.error' >/dev/null; then
            echo "::error::Cannot list templates: $(echo "$out" | jq -r '.error.message')"
            exit 1
          fi
          count=$(echo "$out" | jq '.data | length')
          echo "$count template(s) on this WABA:"
          echo "$out" | jq -r '.data[]? | "  - \(.name)  [\(.status)]  \(.category)  \(.language)"'

      # Everything below asks the API what is actually true of this account, because Meta's docs
      # describe the product rather than this WABA — and the interesting answers here are all
      # account-specific: which tier it is on, what is switched on, what is already subscribed.
      # All read-only, and each prints its own error rather than failing the job: a missing
      # capability is a finding, not a broken check.

      # The messaging tier is the gate on the Calling API (it needs 2,000 unique recipients/day),
      # and it also caps how fast the pilot can grow. A new WABA starts far below it.
      - name: What tier and quality this number is on
        run: |
          for f in "throughput" "quality_rating" "messaging_limit_tier" "status" "name_status" "code_verification_status"; do
            v=$(curl -sS "$GRAPH/$WABA/phone_numbers?fields=$f&access_token=$TOKEN" | jq -c ".data[0].$f // \"—\"" 2>/dev/null)
            echo "  $f: $v"
          done

      # Whether voice calling is switched on for this number at all, and on what terms.
      - name: Are calling features enabled
        run: |
          pid=$(curl -sS "$GRAPH/$WABA/phone_numbers?access_token=$TOKEN" | jq -r '.data[0].id')
          out=$(curl -sS "$GRAPH/$pid/settings?access_token=$TOKEN")
          echo "$out" | jq '.' 2>/dev/null || echo "$out"

      # Which webhook fields this app already receives. Two are worth having and easy to miss:
      # message_template_status_update (Meta approved or rejected a template) and user_preferences
      # (a user opted out of marketing) — the second is an authoritative opt-out signal next to the
      # "הסר" text matching in leadfinder/inboundReplies.ts.
      - name: Which webhooks are subscribed
        run: |
          app=$(curl -sS "$GRAPH/debug_token?input_token=$TOKEN&access_token=$TOKEN" | jq -r '.data.app_id')
          out=$(curl -sS "$GRAPH/$app/subscriptions?access_token=$TOKEN")
          if echo "$out" | jq -e '.error' >/dev/null; then
            echo "Could not read subscriptions: $(echo "$out" | jq -r '.error.message')"
          else
            echo "$out" | jq -r '.data[]? | "  \(.object): \([.fields[]?.name] | join(", "))"'
          fi

      # Meta's own pre-written templates. If one covers appointment reminders in Hebrew, using it
      # skips both the wording risk and the review wait — the whole rejection class we have been
      # designing around stops applying.
      - name: Is there a usable template in Meta's library
        run: |
          for ep in "$GRAPH/$WABA/template_library" "$GRAPH/$WABA/message_template_library" "$GRAPH/message_template_library"; do
            out=$(curl -sS "$ep?limit=100&access_token=$TOKEN")
            if echo "$out" | jq -e '.data' >/dev/null 2>&1; then
              echo "Endpoint that answered: $ep"
              # Entries are one per (name, language), so a single page is one template in a
              # hundred languages. Page through, keep only Hebrew, and report the use cases —
              # Hebrew coverage is the whole question, since an English-only library template is
              # no use to a salon in Israel.
              url="$ep?limit=250&access_token=$TOKEN"
              : > /tmp/lib.json
              for i in $(seq 1 12); do
                page=$(curl -sS "$url")
                echo "$page" | jq -c '.data[]?' >> /tmp/lib.json
                nxt=$(echo "$page" | jq -r '.paging.next // empty')
                [ -z "$nxt" ] && break
                url="$nxt"
              done
              echo "Fetched $(wc -l < /tmp/lib.json) library entries across all languages."
              echo
              echo "Hebrew templates in Meta's library:"
              jq -r 'select(.language=="he") | "  - \(.name)  [\(.category)]  \(.usecase)"' /tmp/lib.json | sort -u | head -40
              echo
              echo "Appointment/booking use cases (any language) — tells us what exists at all:"
              jq -r '.usecase' /tmp/lib.json | sort -u | grep -Ei 'appoint|book|remind|visit|feedback|confirm' | head -20
              exit 0
            fi
          done
          echo "No template-library edge answered on this WABA. Last error:"
          echo "$out" | jq -r '.error.message // .' 2>/dev/null | head -3
