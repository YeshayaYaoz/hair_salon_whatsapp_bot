name: Send a sample receipt

# One sample receipt message from Tori's number to one phone — what a business's customer gets.
# No document, no database. Unticked, it prints the exact message and sends nothing.
on:
  workflow_dispatch:
    inputs:
      to:
        description: "Recipient phone"
        required: true
      name:
        description: "Greeting name"
        default: ""
      confirm:
        description: "Actually send"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
      TO: ${{ inputs.to }}
      NAME: ${{ inputs.name }}
      CONFIRM: ${{ inputs.confirm == true && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm i -g @railway/cli
      - name: Send
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/send-sample-receipt.ts --to "$TO" ${NAME:+--name "$NAME"} ${CONFIRM:+--confirm}
