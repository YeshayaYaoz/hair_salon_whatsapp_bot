name: Check carrier and Meta wiring

# Read-only. The Zadarma credentials live in Railway rather than in Actions secrets, so this runs
# the probe through `railway run`, which injects that environment — the same way the Cartesia probe
# is meant to be run from a laptop, minus the laptop.
#
# Manual only: this is a diagnostic, not something a push should trigger.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Also add any missing Meta webhook fields (writes to the live app subscription)"
        type: boolean
        default: false
      list_numbers:
        description: "Also list Israeli destinations available to buy (read-only, no order placed)"
        type: boolean
        default: false
      direction_id:
        description: "Show the actual free numbers on this destination id (read-only)"
        default: ""
      raw:
        description: "Print the raw Zadarma JSON — for when a listing disagrees with the dashboard"
        type: boolean
        default: false
      whisper:
        description: "Transcribe the call recording with Whisper instead of trusting the agent's own transcript"
        type: boolean
        default: false
      order_number:
        description: "Order this exact number (starts a monthly charge). Needs order_direction too."
        default: ""
      order_direction:
        description: "Destination id the ordered number belongs to"
        default: "3061"
      forward_number:
        description: "Point this number's calls at Cartesia (same wiring the dashboard does)"
        default: ""
      code_for:
        description: "Read a six-digit verification code out of recent Cartesia calls to this number"
        default: ""
      discover_calls:
        description: "Print which Cartesia call endpoints this account exposes"
        type: boolean
        default: false


jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Probe Zadarma
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set — this probe reads the Zadarma keys out of the Railway environment."
            exit 1
          fi
          npm i -g @railway/cli
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/zadarma-probe.ts

      # Read-only unless `apply` is ticked. The write replaces the app's webhook field list rather
      # than adding to it, so an unchecked run is the only safe way to see what is there first.
      - name: Meta webhook fields
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
          APPLY: ${{ inputs.apply }}
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/meta-webhook-fields.ts ${APPLY:+--apply}

      # Read-only. Ordering is a separate script invocation that refuses to run without --confirm,
      # because a monthly charge is a decision rather than a step.
      - name: Numbers available to buy
        if: inputs.list_numbers
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
          RAW: ${{ inputs.raw }}
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/zadarma-number.ts --list IL ${RAW:+--raw}

      - name: Free numbers on a destination
        if: inputs.direction_id != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
          DIRECTION: ${{ inputs.direction_id }}
          RAW: ${{ inputs.raw }}
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/zadarma-number.ts --available "$DIRECTION" ${RAW:+--raw}

      # The only step here that spends money. It names the exact number rather than taking whatever
      # the listing returns first, because a phone number is a lasting identity for the business and
      # 'whichever came back' is not a choice anyone made.
      - name: Order a number
        if: inputs.order_number != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
          NUM: ${{ inputs.order_number }}
          DIR: ${{ inputs.order_direction }}
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/zadarma-number.ts --order "$DIR" --number "$NUM" --confirm

      - name: Forward a number to Cartesia
        if: inputs.forward_number != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
          FWD: ${{ inputs.forward_number }}
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/zadarma-number.ts --forward "$FWD"

      - name: Discover Cartesia call endpoints
        if: inputs.discover_calls
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/cartesia-code.ts --discover

      # The code is single-use and expires in minutes, but it still lands in a log anyone with repo
      # read access can open later. Masked on the way out.
      - name: Read the verification code from Cartesia
        if: inputs.code_for != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
          TO: ${{ inputs.code_for }}
          DUMP: ${{ inputs.raw }}
          WHISPER: ${{ inputs.whisper }}
        run: |
          out=$(railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/cartesia-code.ts --to "$TO" ${DUMP:+--dump} ${WHISPER:+--whisper} 2>&1) || true
          code=$(echo "$out" | grep -oE '[0-9]{6}' | tail -1 || true)
          [ -n "$code" ] && echo "::add-mask::$code"
          echo "$out"
