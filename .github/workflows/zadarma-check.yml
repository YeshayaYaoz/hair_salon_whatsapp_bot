name: Check carrier and Meta wiring

# Read-only. The Zadarma credentials live in Railway rather than in Actions secrets, so this runs
# the probe through `railway run`, which injects that environment — the same way the Cartesia probe
# is meant to be run from a laptop, minus the laptop.
#
# Manual only: this is a diagnostic, not something a push should trigger.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Also add any missing Meta webhook fields (writes to the live app subscription)"
        type: boolean
        default: false
      list_numbers:
        description: "Also list Israeli numbers available to buy (read-only, no order placed)"
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Probe Zadarma
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set — this probe reads the Zadarma keys out of the Railway environment."
            exit 1
          fi
          npm i -g @railway/cli
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/zadarma-probe.ts

      # Read-only unless `apply` is ticked. The write replaces the app's webhook field list rather
      # than adding to it, so an unchecked run is the only safe way to see what is there first.
      - name: Meta webhook fields
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
          APPLY: ${{ inputs.apply }}
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/meta-webhook-fields.ts ${APPLY:+--apply}

      # Read-only. Ordering is a separate script invocation that refuses to run without --confirm,
      # because a monthly charge is a decision rather than a step.
      - name: Numbers available to buy
        if: inputs.list_numbers
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/zadarma-number.ts --list IL
