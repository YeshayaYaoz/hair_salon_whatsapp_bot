name: Probe SMS cost and senders

# Which senders Zadarma allows towards an Israeli mobile, and what one SMS there is billed. The
# Zadarma keys live in Railway, not in Actions secrets, so this runs through `railway run` — the
# same way every other carrier probe here does, and the reason nothing has to be installed on a
# laptop.
#
# Manual only. Two inputs:
#   phone  → an Israeli number (972…). Free: balance + the senders allowed towards it. The sender
#            list is per destination (Zadarma's `phones` parameter), so this is needed even for
#            the free question. Empty → balance only.
#   send   → tick to send ONE real Hebrew SMS to that number and print what it was billed, per
#            SMS and in shekels. List price for Israel is $0.22 per SMS; this shows what a
#            two-part Hebrew reminder actually costs and which sender it arrives from.
on:
  workflow_dispatch:
    inputs:
      phone:
        description: "Israeli number (972…) to ask about. Free: lists the senders allowed towards it."
        type: string
        default: ""
      send:
        description: "Also send ONE real SMS to that number and report its cost."
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci

      - name: Balance, allowed senders, and (if ticked) one priced send
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
          RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
          PHONE: ${{ inputs.phone }}
          SEND: ${{ inputs.send }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is not set — this probe reads the Zadarma keys out of the Railway environment."
            exit 1
          fi
          npm i -g @railway/cli
          # The number is a personal phone; keep it out of a log anyone with repo read access can open.
          [ -n "$PHONE" ] && echo "::add-mask::$PHONE"
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/zadarma-sms-probe.ts ${PHONE:+--phone "$PHONE"} $([ "$SEND" = "true" ] && echo --send)
