name: Diagnose WhatsApp delivery

# Read-only. Answers why a message Meta accepted was never delivered — the failures that live on
# the account rather than in the request, and that a 200 from the send endpoint cannot show.
#
# Runs through `railway run` because several Graph edges need an appsecret_proof, and
# WHATSAPP_APP_SECRET lives in the backend service's variables. It stays there: nothing here prints
# it, and it never becomes an Actions secret.
on:
  workflow_dispatch:
    inputs:
      test_to:
        description: "Also send one test template to this number (blank = diagnose only)"
        type: string
        default: ""
      test_template:
        description: "Template to send — pick a UTILITY one to test against a MARKETING opt-out"
        type: string
        default: "tori_owner_alert"
      project:
        description: "Railway project (as `railway status` prints it)"
        type: string
        default: "Tori"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
      SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
      PROJECT: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm i -g @railway/cli
      - run: railway link --project "$PROJECT" --environment "$RAILWAY_ENVIRONMENT" || true
      - name: Diagnose
        run: |
          railway run --service "$SERVICE" --environment "$RAILWAY_ENVIRONMENT" -- \
            npx tsx scripts/meta-delivery-diagnose.ts

      # A MARKETING template is dropped for a recipient who opted out of marketing, while a UTILITY
      # one to the same number still arrives — with no error on either. Sending one of each is the
      # only way to tell that apart from an account-level block.
      - name: Send a test template
        if: inputs.test_to != ''
        run: |
          railway run --service "$SERVICE" --environment "$RAILWAY_ENVIRONMENT" -- \
            npx tsx scripts/send-test-template.ts \
              --to "${{ inputs.test_to }}" --template "${{ inputs.test_template }}" --param "בדיקת מסירה"
