name: Broadcast the announcement

# Runs the two announcement scripts against production, through `railway run` so they see the
# backend service's own DATABASE_URL and Meta credentials.
#
# Dry run by default, on both channels. The dry run prints the actual recipient list rather than a
# count, because the failure worth guarding against is not "the send breaks" but "the send works, on
# the wrong list" — and neither a delivered WhatsApp message nor a delivered email can be recalled.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to run"
        type: choice
        options: ["both", "whatsapp", "email"]
        default: "both"
      confirm:
        description: "Actually send (leave off to list recipients only)"
        type: boolean
        default: false
      only:
        description: "Send to just this one recipient — a phone for whatsapp, an email address for email"
        type: string
        default: ""
      project:
        description: "Railway project (as `railway status` prints it)"
        type: string
        default: "Tori"

jobs:
  broadcast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
      SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
      PROJECT: ${{ inputs.project }}
      CONFIRM: ${{ inputs.confirm && '--confirm' || '' }}
      ONLY: ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate

      - name: Install the Railway CLI
        # Not pinned: v3 queries a User.teams field the API no longer has.
        run: npm i -g @railway/cli

      - name: Link the project
        run: railway link --project "$PROJECT" --environment "$RAILWAY_ENVIRONMENT" || true

      - name: WhatsApp
        if: inputs.channel == 'both' || inputs.channel == 'whatsapp'
        run: |
          args="$CONFIRM"
          [ -n "$ONLY" ] && args="$args --only $ONLY"
          railway run --service "$SERVICE" --environment "$RAILWAY_ENVIRONMENT" -- \
            npx tsx scripts/announce-whatsapp.ts $args

      - name: Email
        if: inputs.channel == 'both' || inputs.channel == 'email'
        run: |
          args="$CONFIRM"
          [ -n "$ONLY" ] && args="$args --only $ONLY"
          railway run --service "$SERVICE" --environment "$RAILWAY_ENVIRONMENT" -- \
            npx tsx scripts/announce-update.ts $args
