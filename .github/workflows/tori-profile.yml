name: Tori's WhatsApp business profile

# Fills in the card people see when they tap Tori's business name, and the profile picture.
#
# Dry run by default — it prints what is on the profile now beside what it would write, because
# Meta overwrites the fields it receives and there is no history to compare against afterwards.
#
# Through `railway run`: the outreach token, META_APP_ID and the phone number id all live in the
# backend service's variables.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Actually write it"
        type: boolean
        default: false
      project:
        description: "Railway project (as `railway status` prints it)"
        type: string
        default: "Tori"

jobs:
  profile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
      SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
      PROJECT: ${{ inputs.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm i -g @railway/cli
      - run: railway link --project "$PROJECT" --environment "$RAILWAY_ENVIRONMENT" || true
      - name: Apply
        run: |
          railway run --service "$SERVICE" --environment "$RAILWAY_ENVIRONMENT" -- \
            npx tsx scripts/tori-profile.ts ${{ inputs.confirm && '--confirm' || '' }}
