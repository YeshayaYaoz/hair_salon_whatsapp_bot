name: Probe PayPlus Invoice+

# Read-only by default: asks PayPlus to PREVIEW a receipt for one business and prints its raw
# answer, so a refusal names the setting rather than "missing document settings".
on:
  workflow_dispatch:
    inputs:
      business:
        description: "Business id"
        required: true
      confirm:
        description: "Issue a REAL ₪1 receipt instead of a preview (an accounting document)"
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE || vars.RAILWAY_SERVICE || 'hair_salon_whatsapp_bot' }}
      RAILWAY_ENVIRONMENT: ${{ secrets.RAILWAY_ENVIRONMENT || vars.RAILWAY_ENVIRONMENT || 'production' }}
      BUSINESS: ${{ inputs.business }}
      CONFIRM: ${{ inputs.confirm == true && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm i -g @railway/cli
      - name: Probe
        run: |
          railway run --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" \
            npx tsx scripts/payplus-invoice-probe.ts --business "$BUSINESS" ${CONFIRM:+--confirm}
