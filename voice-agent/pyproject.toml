[project]
name = "tori-voice-agent"
version = "0.1.0"
description = "Tori's Cartesia voice agent — answers salons' phone calls using their own data"
# Cartesia builds the virtual environment from this file and reads the interpreter range here.
# Line supports 3.9–3.13; pinned to <3.14 so a new interpreter landing on their builders cannot
# silently change what this runs on.
requires-python = ">=3.11,<3.14"
dependencies = [
    "cartesia-line>=0.2.16",
    "litellm>=1.83,<=1.84",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Only needed to run check.py locally; the deployed agent never serves itself.
dev = ["uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# main.py is a module at the project root, not a package — Cartesia loads it directly.
py-modules = ["main"]
